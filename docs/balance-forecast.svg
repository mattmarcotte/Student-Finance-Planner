<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
  <title id="title">A student cash-flow forecast</title>
  <desc id="desc">A sample CAD balance rises on two paydays, then falls to $1,274.00 after month-end rent. The forecast spends 4 days below the $1,600 buffer target.</desc>
  <rect width="960" height="370" rx="14" fill="#151a16"/>
  <path d="M32 76H928" stroke="#303a32"/>
  <text x="32" y="49" fill="#edf1e9" font-family="system-ui, sans-serif" font-size="25" font-weight="650">Balance forecast</text>
  <text x="928" y="48" fill="#aebbb0" text-anchor="end" font-family="monospace" font-size="14">SAMPLE DATA / CAD</text>
  <g fill="#aebbb0" font-family="monospace" font-size="14">
    <path d="M106 299H904" stroke="#303a32"/><text x="90" y="304" text-anchor="end">$1,000</text>
    <path d="M106 233H904" stroke="#303a32"/><text x="90" y="238" text-anchor="end">$1,500</text>
    <path d="M106 168H904" stroke="#303a32"/><text x="90" y="173" text-anchor="end">$2,000</text>
    <path d="M106 102H904" stroke="#303a32"/><text x="90" y="107" text-anchor="end">$2,500</text>
    <text x="106" y="326" text-anchor="middle">Nov 8</text>
    <text x="306" y="326" text-anchor="middle">Nov 15</text>
    <text x="505" y="326" text-anchor="middle">Nov 22</text>
    <text x="705" y="326" text-anchor="middle">Nov 29</text>
    <text x="904" y="326" text-anchor="middle">Dec 6</text>
  </g>
  <path d="M106 220H904" stroke="#f6b19f" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M106 207 H135 V207 H163 V207 H192 V207 H220 V207 H249 V131 H277 V131 H306 V141 H334 V141 H363 V148 H391 V148 H420 V148 H448 V169 H477 V169 H505 V179 H534 V179 H562 V185 H591 V185 H619 V185 H648 V109 H676 V109 H705 V119 H733 V263 H762 V263 H790 V263 H819 V263 H847 V207 H876 V207 H904 V217" fill="none" stroke="#bcf279" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#d5e9c6" font-family="system-ui, sans-serif" font-size="15">
    <circle cx="249" cy="131" r="5" fill="#bcf279"/>
    <text x="249" y="118" text-anchor="middle">Payday</text>
    <circle cx="648" cy="109" r="5" fill="#bcf279"/>
    <text x="648" y="96" text-anchor="middle">Payday</text>
  </g>
  <circle cx="733" cy="263" r="5" fill="#f6b19f" stroke="#151a16" stroke-width="1.5"/>
  <text x="721" y="268" text-anchor="end" fill="#f6b19f" font-family="system-ui, sans-serif" font-size="15">Rent · $1,274.00 low</text>
  <path d="M32 346H54" stroke="#f6b19f" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="351" fill="#f6b19f" font-family="system-ui, sans-serif" font-size="15">$1,600 buffer target</text>
  <text x="928" y="351" fill="#f6b19f" text-anchor="end" font-family="system-ui, sans-serif" font-size="15">4 days below target</text>
</svg>
